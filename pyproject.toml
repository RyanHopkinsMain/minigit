[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigit"
version = "0.1.0"
description = "Git's core data model, rebuilt from scratch in readable Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
minigit = "minigit.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["minigit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
